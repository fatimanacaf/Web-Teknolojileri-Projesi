<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Fatima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">
    <!-- Navigasyon -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand" href="index.html">Fatima'nın Portfolyosu</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Anasayfa</a>
                <a class="nav-link" href="sehrim.html">Şehrim</a>
                <a class="nav-link" href="mirasimiz.html">Mirasımız</a>
                <a class="nav-link active" href="iletisim.html">İletişim</a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6 bg-white p-4 shadow rounded">
                <h2 class="text-center mb-4">Bana Ulaşın</h2>
                
                <!-- Form Başlangıcı -->
                <form id="contactForm" action="islem.php" method="POST" onsubmit="return validateForm()">
                    <div class="mb-3">
                        <label for="name" class="form-label">Adınız Soyadınız:</label>
                        <input type="text" class="form-control" id="name" name="name">
                    </div>
                    
                    <div class="mb-3">
                        <label for="email" class="form-label">E-posta Adresiniz:</label>
                        <input type="email" class="form-control" id="email" name="email">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Cinsiyet:</label><br>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Kadın">
                            <label class="form-check-label">Kadın</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="gender" value="Erkek">
                            <label class="form-check-label">Erkek</label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="message" class="form-label">Mesajınız:</label>
                        <textarea class="form-control" id="message" name="message" rows="4"></textarea>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary">Gönder</button>
                        <button type="reset" class="btn btn-outline-secondary">Temizle</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- JAVASCRIPT KONTROLÜ -->
    <script>
        function validateForm() {
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let message = document.getElementById("message").value;
            let gender = document.querySelector('input[name="gender"]:checked');

            if (name == "" || email == "" || message == "" || !gender) {
                alert("Lütfen tüm alanları eksiksiz doldurunuz!");
                return false; // Formun gönderilmesini engeller
            }

            // E-posta formatı kontrolü
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailPattern.test(email)) {
                alert("Lütfen geçerli bir e-posta adresi giriniz!");
                return false;
            }

            return true; // Her şey doğruysa gönderilir
        }
    </script>

    <footer class="text-center py-4 bg-dark text-white fixed-bottom d-none d-md-block">
        <p>&copy; 2026 Fatima - Tüm Hakları Saklıdır.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
