<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>İlgi Alanlarım - API</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Fatima'nın Portfolyosu</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Hakkında</a>
                <a class="nav-link active" href="ilgi-alanlarim.html">İlgi Alanlarım</a>
            </div>
        </div>
    </nav>

    <div class="container my-5">
        <h2 class="text-center mb-4">Sevdiğim Diziler (API Verisi)</h2>
        <div id="film-listesi" class="row g-4">
            </div>
    </div>

    <script>
        // Ücretsiz TVMaze API kullanarak dizi verisi çekme 
        fetch('https://api.tvmaze.com/singlesearch/shows?q=friends&embed=episodes')
            .then(response => response.json())
            .then(data => {
                const liste = document.getElementById('film-listesi');
                data._embedded.episodes.slice(0, 6).forEach(bolum => {
                    liste.innerHTML += `
                        <div class="col-md-4">
                            <div class="card h-100 shadow-sm">
                                <img src="${bolum.image.medium}" class="card-img-top">
                                <div class="card-body">
                                    <h5 class="card-title">${bolum.name}</h5>
                                    <p class="card-text text-muted">Sezon: ${bolum.season} | Bölüm: ${bolum.number}</p>
                                </div>
                            </div>
                        </div>`;
                });
            })
            .catch(err => console.error("Veri çekilemedi:", err));
    </script>
</body>
</html>
